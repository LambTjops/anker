## Anker — SWAG proxy conf.
## Copy to /config/nginx/proxy-confs/anker.subdomain.conf in your SWAG volume.
## Create the password file once (inside the SWAG container):
##   docker exec -it swag htpasswd -c /config/nginx/.htpasswd-anker <username>

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;

    server_name anker.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 1m;

    auth_basic "Anker";
    auth_basic_user_file /config/nginx/.htpasswd-anker;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app anker;
        set $upstream_port 3000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    # The install manifest and icons are harmless and some browsers fetch them
    # without credentials, which would break "Add to home screen".
    location ~ ^/(manifest\.webmanifest|icons/) {
        auth_basic off;
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app anker;
        set $upstream_port 3000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
